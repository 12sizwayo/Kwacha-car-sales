<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kwacha Car Sales</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #111;
            color: white;
            padding: 15px;
            text-align: center;
        }
        section {
            padding: 20px;
        }
        .cars {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .car {
            background-color: white;
            width: 220px;
            border-radius: 5px;
            padding: 10px;
            text-align: center;
        }
        .car img {
            width: 100%;
            height: auto;
        }
        footer {
            background-color: #111;
            color: white;
            text-align: center;
            padding: 10px;
        }
    </style>
</head>
<body>

<header>
    <h1>Kwacha Car Sales</h1>
    <p>Affordable cars priced in ZMW</p>
</header>

<section>
    <div class="cars">
        <div class="car">
            <img src="car1.jpg" alt="Toyota">
            <h3>Toyota Corolla</h3>
            <p>Price: ZMW 85,000</p>
        </div>

        <div class="car">
            <img src="car2.jpg" alt="Mazda">
            <h3>Mazda Demio</h3>
            <p>Price: ZMW 72,500</p>
        </div>

        <div class="car">
            <img src="car3.jpg" alt="Honda">
            <h3>Honda Fit</h3>
            <p>Price: ZMW 78,000</p>
        </div>

        <div class="car">
            <img src="car4.jpg" alt="Nissan">
            <h3>Nissan March</h3>
            <p>Price: ZMW 69,000</p>
        </div>
    </div>
</section>

<footer>
    <p>Contact: 0970000000 | Lusaka, Zambia</p>
</footer>

</body>
</html>
